<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gráfico de Temperaturas</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <h1>🌡️ Temperaturas en tiempo real</h1>

    <div class="controles">
      <label>
        Desde
        <input type="date" id="fecha-desde" title="Fecha inicial" />
      </label>
      <label>
        Hasta
        <input type="date" id="fecha-hasta" title="Fecha final" />
      </label>
      <button id="btn-actualizar" type="button">Actualizar datos</button>
    </div>

    <p id="estado-carga" class="estado-carga"></p>
    <canvas id="grafica"></canvas>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
