<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gráfico de Temperaturas</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f5f5f5;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    canvas {
      margin-top: 20px;
    }

    button {
      display: block;
      margin: 10px auto;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🌡️ Temperaturas en tiempo real</h1>

    <button onclick="cargarDatos()">Actualizar datos</button>

    <canvas id="grafica"></canvas>
  </div>

  <script>
    let chart;

    async function cargarDatos() {
      try {
        const res = await fetch("https://api.mueblesavenida.com/items/temperaturas");
        const json = await res.json();

        // ⚠️ Ajusta esto si tu API usa otro formato (ej: json.data)
        const datos = json.data || json;

        const labels = datos.map(d =>
          new Date(d.fecha || d.timestamp).toLocaleString()
        );

        const temperaturas = datos.map(d => d.temperatura);

        dibujarGrafica(labels, temperaturas);

      } catch (err) {
        console.error("Error cargando datos:", err);
        alert("Error al obtener datos de la API");
      }
    }

    function dibujarGrafica(labels, data) {
      const ctx = document.getElementById("grafica");

      if (chart) chart.destroy();

      chart = new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: "Temperatura (°C)",
            data: data,
            borderColor: "red",
            tension: 0.3,
            fill: false
          }]
        },
        options: {
          responsive: true,
          scales: {
            x: {
              ticks: {
                maxRotation: 45,
                minRotation: 45
              }
            }
          }
        }
      });
    }

    // Carga inicial
    cargarDatos();
  </script>
</body>
</html>
