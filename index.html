<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gráfico de Temperaturas</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="page-shell">
      <header class="page-header">
        <h1>Temperaturas en tiempo real</h1>
      </header>

      <section class="panel filters-panel" aria-label="Filtros de fechas">
        <div class="controles">
          <label>
            <span>Desde</span>
            <input type="date" id="fecha-desde" title="Fecha inicial" />
          </label>
          <label>
            <span>Hasta</span>
            <input type="date" id="fecha-hasta" title="Fecha final" />
          </label>
          <button id="btn-actualizar" type="button">Actualizar datos</button>
        </div>
        <p id="estado-carga" class="estado-carga"></p>
      </section>

      <section class="metrics" aria-label="Resumen de datos">
        <article class="metric-card">
          <span class="metric-label">Registros</span>
          <strong id="metric-registros">--</strong>
        </article>
        <article class="metric-card">
          <span class="metric-label">Temperatura media</span>
          <strong id="metric-media">--</strong>
        </article>
        <article class="metric-card">
          <span class="metric-label">Rango</span>
          <strong id="metric-rango">--</strong>
        </article>
      </section>

      <section class="panel chart-panel">
        <div class="panel-header">
          <div>
            <p class="panel-kicker">Tendencia</p>
            <h2>Registro histórico de temperatura</h2>
          </div>
        </div>
        <div class="chart-shell">
          <canvas id="grafica"></canvas>
        </div>
      </section>
    </main>

  <script src="app.js" defer></script>
</body>
</html>
